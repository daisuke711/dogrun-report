<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドッグランレポートメーカー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4A7C3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ドッグランレポート">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#22201C;
    --ink-soft:#6B675E;
    --line:#E2DED4;
    --grass:#4A7C3F;
    --grass-soft:#EDF3EA;
    --paw:#C2703F;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.7;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
  }
  header{
    padding:calc(20px + env(safe-area-inset-top)) 20px 16px;
    border-bottom:1px solid var(--line);
    background:#fff;
    position:sticky;top:0;z-index:20;
  }
  header h1{
    margin:0;font-size:19px;font-weight:700;letter-spacing:.02em;
  }
  header p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
  main{max-width:640px;margin:0 auto;padding:20px 16px}
  section{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;margin-bottom:16px;
  }
  h2{
    margin:0 0 14px;font-size:14px;font-weight:700;letter-spacing:.08em;
    color:var(--grass);display:flex;align-items:center;gap:8px;
  }
  h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grass)}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 5px;font-weight:600}
  input[type=text],input[type=date],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--grass);outline-offset:1px;border-color:transparent}
  textarea{min-height:96px;resize:vertical;line-height:1.7}
  .field{margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.row{grid-template-columns:1fr}}

  /* rating */
  .rate{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px dashed var(--line);gap:12px;
  }
  .rate:last-child{border-bottom:none}
  .rate-name{font-size:15px;font-weight:600;flex:1}
  .stars{display:flex;gap:2px}
  .star{
    border:none;background:none;padding:4px 2px;cursor:pointer;
    font-size:22px;line-height:1;color:var(--line);transition:color .12s;
  }
  .star.on{color:var(--paw)}
  .star:focus-visible{outline:2px solid var(--grass);border-radius:4px}
  .hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 12px}

  /* photos */
  #drop{
    border:2px dashed var(--line);border-radius:var(--radius);
    padding:26px 16px;text-align:center;color:var(--ink-soft);
    font-size:14px;cursor:pointer;background:var(--grass-soft);
  }
  #drop.hot{border-color:var(--grass);color:var(--grass)}
  #thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
  .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{
    position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
    border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;line-height:1;
  }
  .thumb span{
    position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;
    font-size:10px;padding:2px 4px;text-align:center;
  }

  /* mic */
  .mic{
    border:1px solid var(--line);background:#fff;border-radius:9px;
    padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;font-family:inherit;
  }
  .mic.rec{background:var(--paw);color:#fff;border-color:var(--paw)}

  /* footer bar */
  .bar{
    position:fixed;bottom:0;left:0;right:0;background:#fff;
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;justify-content:center;z-index:30;
  }
  .saved-note{
    font-size:11px;color:var(--ink-soft);text-align:center;
    padding:0 16px 8px;margin:-8px 0 0;
  }
  .btn{
    flex:1;max-width:300px;padding:14px;border-radius:12px;border:none;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
    background:var(--grass);color:#fff;
  }
  .btn.sub{background:#fff;color:var(--ink-soft);border:1px solid var(--line);flex:0 0 auto;max-width:none;padding:14px 18px}
  .btn:active{transform:translateY(1px)}
  .out{
    width:100%;display:flex;align-items:center;gap:14px;text-align:left;
    padding:15px 14px;margin-bottom:10px;background:#fff;
    border:1.5px solid var(--line);border-radius:12px;cursor:pointer;
    font-family:inherit;color:var(--ink);
  }
  .out:last-child{margin-bottom:0}
  .out:active{background:var(--grass-soft);border-color:var(--grass)}
  .out-ico{font-size:26px;line-height:1;flex:0 0 auto}
  .out-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .out-txt strong{font-size:16px;font-weight:700}
  .out-txt{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
  .out.done{border-color:var(--grass);background:var(--grass-soft)}
  #imgwrap{padding:16px;text-align:center;max-height:64vh;overflow:auto;background:#F1EEE8}
  #imgwrap canvas{max-width:100%;height:auto;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .toast{
    position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;white-space:nowrap;
  }
  .toast.show{opacity:1}
  dialog{
    border:none;border-radius:var(--radius);padding:0;max-width:92vw;width:640px;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .dlg-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .dlg-head strong{font-size:15px}
  .dlg-head button{border:none;background:none;font-size:20px;cursor:pointer;color:var(--ink-soft)}
  #mdout{
    margin:0;padding:16px 18px;max-height:60vh;overflow:auto;font-size:12.5px;
    font-family:ui-monospace,"SF Mono",Consolas,monospace;white-space:pre-wrap;line-height:1.6;
  }
  .dlg-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
</style>
</head>
<body>

<header>
  <h1>ドッグランレポートメーカー</h1>
  <p>写真を選んで、★をつけて、感想を書くだけ</p>
</header>

<main>

<section>
  <h2>基本情報</h2>
  <div class="field">
    <label for="f-name">施設名</label>
    <input type="text" id="f-name" placeholder="例：プライムランドドッグランド">
  </div>
  <div class="row">
    <div class="field">
      <label for="f-date">訪問日</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label for="f-weather">天気</label>
      <select id="f-weather">
        <option value="">選ぶ</option>
        <option>晴れ</option><option>くもり</option><option>雨</option>
        <option>雪</option><option>晴れときどきくもり</option>
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="f-fee-dog">料金（犬1頭あたり）</label>
      <input type="text" id="f-fee-dog" placeholder="例：800円">
    </div>
    <div class="field">
      <label for="f-fee-owner">料金（飼い主1人あたり）</label>
      <input type="text" id="f-fee-owner" placeholder="例：無料 / 300円">
    </div>
  </div>
  <div class="field">
    <label for="f-park">駐車場</label>
    <input type="text" id="f-park" placeholder="例：無料 20台">
  </div>
  <div class="field">
    <label for="f-addr">住所（任意）</label>
    <input type="text" id="f-addr" placeholder="なくても大丈夫">
  </div>
  <div class="field">
    <label for="f-hours">営業時間（任意）</label>
    <input type="text" id="f-hours" placeholder="例：9:00〜18:00">
  </div>
</section>

<section>
  <h2>評価</h2>
  <p class="hint">全部★3から始まります。気になったところだけ動かせば大丈夫です。</p>
  <div id="rates"></div>
</section>

<section>
  <h2>良かったところ</h2>
  <button class="mic" data-target="f-good">🎤 音声で入力</button>
  <textarea id="f-good" placeholder="芝生がふかふかで、ほむらが走り回っていた…"></textarea>
</section>

<section>
  <h2>気になったところ</h2>
  <button class="mic" data-target="f-bad">🎤 音声で入力</button>
  <textarea id="f-bad" placeholder="日陰が少なくて夏は暑そう…"></textarea>
</section>

<section>
  <h2>今日のエピソード</h2>
  <button class="mic" data-target="f-story">🎤 音声で入力</button>
  <textarea id="f-story" placeholder="大きい犬に吠えられて隠れてしまった…"></textarea>
</section>

<section>
  <h2>写真</h2>
  <div id="drop">
    ここに写真をドラッグ、またはタップして選ぶ
  </div>
  <input type="file" id="picker" accept="image/*" multiple hidden>
  <div id="thumbs"></div>
</section>

</main>

<section>
  <h2>なにを作る？</h2>
  <p class="hint">ボタンを押すとコピーされます。そのままAIアプリに貼り付けてください。</p>

  <button class="out" data-mode="insta">
    <span class="out-ico">📷</span>
    <span class="out-txt">
      <strong>インスタの文章</strong>
      本文とハッシュタグを作ります
    </span>
  </button>

  <button class="out" data-mode="youtube">
    <span class="out-ico">▶️</span>
    <span class="out-txt">
      <strong>YouTubeの概要欄</strong>
      タイトル案と概要欄を作ります
    </span>
  </button>

  <button class="out" id="btn-image">
    <span class="out-ico">🖼️</span>
    <span class="out-txt">
      <strong>インスタのレポート画像</strong>
      この場で画像を作ります
    </span>
  </button>
</section>

<section>
  <h2>そのほか</h2>
  <p class="hint" id="save-hint"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn sub" id="btn-preview" style="flex:1;min-width:130px">下書きを見る</button>
    <button class="btn sub" id="btn-save" style="flex:1;min-width:130px">フォルダに保存</button>
    <button class="btn sub" id="btn-new" style="flex:1;min-width:130px">新しいレポート</button>
  </div>
</section>

<div class="bar">
  <div style="width:100%;max-width:640px">
    <p class="saved-note" id="autosave-note" style="margin:0;padding:0"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <div class="dlg-head">
    <strong>report.md の下書き</strong>
    <button id="dlg-close" aria-label="閉じる">×</button>
  </div>
  <pre id="mdout"></pre>
  <div class="dlg-foot">
    <button class="btn sub" id="btn-copy">本文をコピー</button>
  </div>
</dialog>

<dialog id="imgdlg">
  <div class="dlg-head">
    <strong>レポート画像</strong>
    <button id="imgdlg-close" aria-label="閉じる">×</button>
  </div>
  <div id="imgwrap"></div>
  <div class="dlg-foot">
    <button class="btn" id="btn-img-save" style="flex:1">画像を保存</button>
  </div>
</dialog>

<script>
/* ---------- 評価項目 ---------- */
const RATE_ITEMS = [
  ["広さ","spacious"],["地面","ground"],["清潔さ","clean"],["設備","facility"],
  ["日陰","shade"],["大型犬向け","big"],["小型犬向け","small"],["初心者向け","beginner"],
  ["写真映え","photo"],["飼い主満足度","owner"],["ほむら満足度","homura"]
];
const scores = {};
const ratesEl = document.getElementById('rates');

RATE_ITEMS.forEach(([label,key])=>{
  scores[key] = 3;
  const row = document.createElement('div');
  row.className = 'rate';
  const name = document.createElement('div');
  name.className = 'rate-name';
  name.textContent = label;
  const stars = document.createElement('div');
  stars.className = 'stars';
  stars.setAttribute('role','group');
  stars.setAttribute('aria-label', label + 'の評価');
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.className = 'star' + (i<=3 ? ' on' : '');
    b.textContent = '★';
    b.type = 'button';
    b.setAttribute('aria-label', label + ' ' + i + '点');
    b.onclick = ()=>{
      scores[key] = i;
      [...stars.children].forEach((s,idx)=>s.classList.toggle('on', idx < i));
    };
    stars.appendChild(b);
  }
  row.append(name, stars);
  ratesEl.appendChild(row);
});

/* ---------- 写真 ---------- */
let photos = [];
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const thumbs = document.getElementById('thumbs');

drop.onclick = ()=> picker.click();
picker.onchange = e => addPhotos([...e.target.files]);

['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.add('hot');
}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.remove('hot');
}));
drop.addEventListener('drop', e=>{
  addPhotos([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')));
});

function addPhotos(files){
  files.forEach(f=>photos.push(f));
  renderThumbs();
}
function renderThumbs(){
  thumbs.innerHTML = '';
  photos.forEach((f,i)=>{
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = ()=>URL.revokeObjectURL(img.src);
    const x = document.createElement('button');
    x.textContent = '×';
    x.setAttribute('aria-label','この写真を外す');
    x.onclick = ()=>{ photos.splice(i,1); renderThumbs(); };
    const cap = document.createElement('span');
    cap.textContent = photoName(i, f);
    d.append(img, x, cap);
    thumbs.appendChild(d);
  });
}
function photoName(i, f){
  const ext = (f.name.match(/\.[a-z0-9]+$/i)||['.jpg'])[0].toLowerCase();
  return 'photo' + String(i+1).padStart(2,'0') + ext;
}

/* ---------- 音声入力 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.querySelectorAll('.mic').forEach(btn=>{
  if(!SR){ btn.style.display='none'; return; }
  let rec = null;
  btn.onclick = ()=>{
    const ta = document.getElementById(btn.dataset.target);
    if(rec){ rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ja-JP';
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal){
          ta.value += (ta.value && !ta.value.endsWith('\n') ? '\n' : '') + e.results[i][0].transcript;
        }
      }
    };
    rec.onend = ()=>{ rec = null; btn.classList.remove('rec'); btn.textContent='🎤 音声で入力'; };
    rec.onerror = ()=>{ toast('音声入力が使えませんでした'); };
    rec.start();
    btn.classList.add('rec');
    btn.textContent = '■ 話し終わったら押す';
  };
});

/* ---------- Markdown 生成 ---------- */
const v = id => document.getElementById(id).value.trim();
const stars5 = n => '★'.repeat(n) + '☆'.repeat(5-n) + '（' + n + '/5）';

function folderName(){
  const d = v('f-date') || new Date().toISOString().slice(0,10);
  const n = v('f-name') || '無題のドッグラン';
  return d + '_' + n.replace(/[\\/:*?"<>|]/g,'_');
}

function buildMarkdown(mode){
  const L = [];
  L.push('# ドッグランレポート','');
  L.push('## 基本情報','');
  L.push('施設名：' + v('f-name'));
  L.push('訪問日：' + v('f-date'));
  L.push('天気：' + v('f-weather'));
  L.push('料金（犬1頭あたり）：' + v('f-fee-dog'));
  L.push('料金（飼い主1人あたり）：' + v('f-fee-owner'));
  L.push('駐車場：' + v('f-park'));
  if(v('f-addr'))  L.push('住所：' + v('f-addr'));
  if(v('f-hours')) L.push('営業時間：' + v('f-hours'));
  L.push('','---','','## 評価','');
  RATE_ITEMS.forEach(([label,key])=> L.push(label + '：' + stars5(scores[key])));
  L.push('','---','','## 良かったところ','', v('f-good') || '（記入なし）');
  L.push('','---','','## 気になったところ','', v('f-bad') || '（記入なし）');
  L.push('','---','','## 今日のエピソード','', v('f-story') || '（記入なし）');
  L.push('','---','','## 写真一覧','');
  if(photos.length){
    photos.forEach((f,i)=> L.push('![' + photoName(i,f) + '](' + photoName(i,f) + ')'));
  } else {
    L.push('（写真なし）');
  }
  if(mode && PROMPTS[mode]) L.push('','---','', PROMPTS[mode]);
  return L.join('\n');
}

const COMMON_RULES = `条件

・体験していないことは書かない
・レポートに無い情報を推測で補わない
・誇張しない
・親しみやすい口調
・絵文字は適度に使用`;

const PROMPTS = {

insta: `# AIへの依頼（Instagram投稿）

あなたは犬のお出かけメディアの編集者です。
上のレポートをもとに、Instagramの投稿文を作ってください。

## 作るもの

1. 本文（1〜2案）
   ・冒頭1行で読み手の手を止める
   ・全体で300〜500文字
   ・スマホで読みやすいよう、2〜3行ごとに改行を入れる
   ・「今日のエピソード」を軸にした、体験が伝わる文章にする
   ・評価の数字は羅列せず、良かった点は言葉で描写する

2. ハッシュタグ 20〜25個
   ・大きめのタグ（#ドッグラン #犬のいる暮らし など）
   ・犬種や地域に絞ったタグ
   ・施設名のタグ
   ・行単位でまとめて、そのままコピーできる形にする

3. 1枚目の写真に入れる短い文字（15文字以内）を3案

${COMMON_RULES}
・宣伝色を出さず、個人の記録として書く`,

youtube: `# AIへの依頼（YouTube概要欄）

あなたは犬のお出かけメディアの編集者です。
上のレポートをもとに、YouTube動画の概要欄を作ってください。

## 作るもの

1. 動画タイトル案 5個
   ・全角30文字前後
   ・施設名と地域名を必ず入れる
   ・煽らず、内容が正確に伝わるものにする

2. 概要欄の本文
   ・冒頭2〜3行で動画の内容がわかるようにする（検索結果に出る部分）
   ・続けて、施設の基本情報を箇条書きで整理する
     （料金・駐車場・営業時間・住所のうち、レポートにあるものだけ）
   ・実際に行ってわかった良かった点と気になった点をまとめる
   ・最後にチャンネル登録の一言を添える

3. 検索用のタグ 15個程度（カンマ区切り）

${COMMON_RULES}
・料金や営業時間は変わる可能性がある旨を一言添える`,

image: `# AIへの依頼（レポート画像の構成案）

あなたはInstagram向けの画像を設計する編集者です。
上のレポートをもとに、写真に重ねる文字の構成案を作ってください。
画像そのものは作らなくて構いません。文字だけ考えてください。

## 作るもの

1枚目（表紙）
　・大見出し（12文字以内）
　・小見出し（20文字以内）

2枚目（基本情報）
　・見出しと、載せる項目を3〜5個

3枚目（良かったところ）
　・見出しと、短い箇条書き3つ（各20文字以内）

4枚目（気になったところ）

async function writeFile(dir, name, blob){
  const h = await dir.getFileHandle(name, {create:true});
  const w = await h.createWritable();
  await w.write(blob);
  await w.close();
}

function downloadFallback(){
  dl(new Blob([buildMarkdown('all')],{type:'text/markdown'}), 'report.md');
  photos.forEach((f,i)=> setTimeout(()=> dl(f, photoName(i,f)), (i+1)*300));
  toast('ダウンロードフォルダに保存しました');
}
function dl(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* ---------- レポート画像の生成 ---------- */
const imgdlg = document.getElementById('imgdlg');

let reportCanvas = null;

  }

function loadImage(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}

// 折り返し描画。返り値は次のy座標
function wrapText(ctx, text, x, y, maxW, lineH, maxLines){
  const chars = [...String(text)];
  let line = '', lines = [];
  for(const ch of chars){
    if(ch === '\n'){ lines.push(line); line = ''; continue; }
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line){
      lines.push(line); line = ch;
    } else { line = test; }
  }
  if(line) lines.push(line);
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].slice(0, -1) + '…';
  }
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineH));
  return y + lines.length * lineH;
}

async function drawReport(){
  const W = 1080, H = 1350;                 // Instagram 4:5
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const GRASS = '#4A7C3F', INK = '#22201C', SOFT = '#6B675E',
        PAPER = '#FBFAF7', LINE = '#E2DED4', PAW = '#C2703F';
  const F = '"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  const PAD = 72;

  ctx.fillStyle = PAPER;
  ctx.fillRect(0,0,W,H);

  // --- 上部：写真かカラーブロック ---
  const HERO = 560;
  if(photos.length){
    try{
      const img = await loadImage(photos[0]);
      const r = Math.max(W/img.width, HERO/img.height);
      const dw = img.width*r, dh = img.height*r;
      ctx.drawImage(img, (W-dw)/2, (HERO-dh)/2, dw, dh);
      const g = ctx.createLinearGradient(0, HERO*0.35, 0, HERO);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(1,'rgba(0,0,0,0.62)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,HERO);
    }catch{
      ctx.fillStyle = GRASS; ctx.fillRect(0,0,W,HERO);
    }
  } else {
    ctx.fillStyle = GRASS;
    ctx.fillRect(0,0,W,HERO);
  }

  // 施設名（写真の上）
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'alphabetic';
  ctx.font = '700 62px ' + F;
  const nameLines = [];
  {
    const chars = [...v('f-name')];
    let line = '';
    for(const ch of chars){
      if(ctx.measureText(line+ch).width > W - PAD*2 && line){ nameLines.push(line); line = ch; }
      else line += ch;
    }
    if(line) nameLines.push(line);
  }
  const shown = nameLines.slice(0,2);
  let ny = HERO - 60 - (shown.length-1)*74;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
  shown.forEach((l,i)=> ctx.fillText(l, PAD, ny + i*74));
  // 日付
  ctx.font = '600 30px ' + F;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  const dLabel = (v('f-date')||'').replace(/-/g,'.') + (v('f-weather') ? '　' + v('f-weather') : '');
  if(dLabel.trim()) ctx.fillText(dLabel, PAD, ny - 90);
  ctx.shadowBlur = 0;

  // --- 評価（上位のみ） ---
  let y = HERO + 78;
  const top = RATE_ITEMS
    .map(([label,key])=>({label, n:scores[key]}))
    .sort((a,b)=> b.n - a.n)
    .slice(0,5);

  ctx.font = '700 26px ' + F;
  ctx.fillStyle = GRASS;
  ctx.fillText('よかったところ', PAD, y);
  y += 46;

  top.forEach(item=>{
    ctx.font = '600 32px ' + F;
    ctx.fillStyle = INK;
    ctx.fillText(item.label, PAD, y);
    ctx.font = '30px ' + F;
    ctx.fillStyle = PAW;
    const s = '★'.repeat(item.n) + '☆'.repeat(5-item.n);
    ctx.fillText(s, W - PAD - ctx.measureText(s).width, y);
    y += 22;
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W-PAD, y); ctx.stroke();
    y += 36;
  });

  // --- コメント ---
  y += 14;
  const comment = v('f-story') || v('f-good') || '';
  if(comment){
    ctx.font = '30px ' + F;
    ctx.fillStyle = SOFT;
    y = wrapText(ctx, comment, PAD, y, W - PAD*2, 46, 3);
  }

  // --- 下部：料金など ---
  const footY = H - 118;
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, footY - 46); ctx.lineTo(W-PAD, footY - 46); ctx.stroke();

  const info = [];
  if(v('f-fee-dog'))   info.push('犬 ' + v('f-fee-dog'));
  if(v('f-fee-owner')) info.push('人 ' + v('f-fee-owner'));
  if(v('f-park'))      info.push('P ' + v('f-park'));
  ctx.font = '28px ' + F;
  ctx.fillStyle = SOFT;
  if(info.length) wrapText(ctx, info.join('　/　'), PAD, footY, W - PAD*2, 40, 2);

  // 肉球マーク
  ctx.fillStyle = PAW;
  const px = W - PAD - 18, py = footY - 6, s = 15;
  ctx.beginPath(); ctx.ellipse(px, py+s*0.28, s*0.52, s*0.45, 0, 0, 7); ctx.fill();
  [[-0.52,-0.62],[-0.18,-0.86],[0.18,-0.86],[0.52,-0.62]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.ellipse(px+dx*s, py+dy*s, s*0.25, s*0.25, 0, 0, 7); ctx.fill();
  });

  return c;
}

document.getElementById('btn-img-save').onclick = ()=>{

    } else {
      dl(blob, name);
      toast('画像を保存しました');
    }
  }, 'image/png');
};

/* ---------- 自動保存 ---------- */
const KEY = 'dogrun-draft-v1';
const TEXT_IDS = ['f-name','f-date','f-weather','f-fee-dog','f-fee-owner',
                  'f-park','f-addr','f-hours','f-good','f-bad','f-story'];

function saveDraft(){
  const data = { scores:{...scores} };
  TEXT_IDS.forEach(id => data[id] = document.getElementById(id).value);
  try{
    localStorage.setItem(KEY, JSON.stringify(data));
    stamp();
  }catch{}
}
function stamp(){
  const t = new Date();
  document.getElementById('autosave-note').textContent =
    '入力は自動保存されています（' +
    String(t.getHours()).padStart(2,'0') + ':' +
    String(t.getMinutes()).padStart(2,'0') + '）';
}
function restoreDraft(){
  let data;
  try{ data = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch{ return false; }
  if(!data) return false;
  TEXT_IDS.forEach(id=>{
    if(typeof data[id] === 'string') document.getElementById(id).value = data[id];
  });
  if(data.scores){
    RATE_ITEMS.forEach(([label,key],ri)=>{
      const n = data.scores[key];
      if(!n) return;
      scores[key] = n;
      const stars = ratesEl.children[ri].querySelector('.stars');
      [...stars.children].forEach((s,idx)=> s.classList.toggle('on', idx < n));
    });
  }
  return true;
}

let saveTimer;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 600); }
TEXT_IDS.forEach(id => document.getElementById(id).addEventListener('input', queueSave));
ratesEl.addEventListener('click', e=>{ if(e.target.classList.contains('star')) queueSave(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveDraft(); });
window.addEventListener('pagehide', saveDraft);

/* ---------- 新しいレポート ---------- */
document.getElementById('btn-new').onclick = ()=>{
  if(!confirm('今の入力を消して、新しいレポートを始めますか？')) return;
  localStorage.removeItem(KEY);
  location.reload();
};

}else{
  document.getElementById('save-hint').textContent =
    'report.md と写真をまとめてフォルダに書き出します。パソコン向けです。';
}

if('serviceWorker' in navigator){

    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------- 初期値 ---------- */
if(!restoreDraft()){
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
}else{
  stamp();
}
